name: Deploy API to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: smart-accessioning-portal
  REGION: us-central1
  SERVICE_NAME: smart-accessioning-api
  IMAGE_NAME: smart-accessioning-api
  REPOSITORY: cloud-run-source-deploy
  RUNTIME_SERVICE_ACCOUNT: 235092307336-compute@developer.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} \
            --region $REGION \
            --allow-unauthenticated \
            --service-account $RUNTIME_SERVICE_ACCOUNT \
            --network default \
            --subnet default \
            --vpc-egress private-ranges-only \
            --set-secrets ConnectionStrings__DefaultConnection=smart-accessioning-db-connection:latest \
            --set-env-vars Database__Provider=SqlServer,Database__ApplyMigrationsOnStartup=true,Storage__Provider=Gcp,GcpStorage__BucketName=smart-accessioning-files-nagarjun,DemoSeed__Enabled=true,DemoSeed__PatientCount=25,DemoSeed__CaseCount=40
